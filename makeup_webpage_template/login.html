<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Makeup Webpage</title>
    <!-- Uses the same style as your main site -->
    <link rel="stylesheet" href="makeup_webpage_template/style.css">
    <style>
        .login-card {
            max-width: 400px;
            margin: 60px auto;
            padding: 2rem 2.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(255,107,157,0.08), 0 1.5px 8px rgba(196,69,105,0.10);
        }
        .login-card h2 {
            text-align: center;
            font-size: 2rem;
            color: #c44569;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .login-card label {
            display: block;
            margin: 0.7rem 0 0.3rem 0;
            color: #c44569;
            font-weight: 500;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid #ff6b9d;
            background: #f8f9fa;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .login-card input:focus {
            border-color: #c44569;
            outline: none;
        }
        .login-card button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,107,157,0.12);
            transition: background 0.2s;
        }
        .login-card button:hover {
            background: linear-gradient(135deg, #c44569 0%, #ff6b9d 100%);
        }
        #loginMessage {
            text-align: center;
            color: #c44569;
            font-weight: 600;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                
                <button type="submit">Login</button>
            </form>
            <div id="loginMessage"></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username && password) {
                localStorage.setItem('loggedInUser', username);
                document.getElementById('loginMessage').textContent = "Login successful! Redirecting...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            } else {
                document.getElementById('loginMessage').textContent = "Please enter both username and password.";
            }
        });
    </script>
</body>
</html>
